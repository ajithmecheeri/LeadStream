[project]
name = "fitfirst-api"
version = "0.1.0"
description = "FitFirst API: job alert ingestion, fit scoring, resume packs and tracking"
requires-python = ">=3.12"
# Exact pins: this is an application, and the generated API client must not drift between machines.
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.0",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  "pyjwt[crypto]==2.14.0",
  "cryptography==50.0.1",
  "beautifulsoup4==4.14.3",
  "procrastinate==3.9.0",
  "psycopg[binary]==3.3.5",  # Procrastinate's driver; the binary build needs no system libpq
  "httpx==0.28.1",  # Voyage (embeddings) and the LLM gateway
  "pypdf==6.21.3",  # resume text from PDF
  "striprtf==0.0.34",  # resume text from RTF
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["nodb: the test needs no database (skips schema setup and cleanup)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]  # line length is left to `ruff format`
