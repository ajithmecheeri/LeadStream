[project]
name = "brewmyjob-jobsearch"
version = "0.1.0"
description = "Job Search Service: employer boards, job APIs and the event feed the BrewMyJob app pulls"
requires-python = ">=3.12"
# Same pins as the main backend (backend/pyproject.toml), so both run on one stack.
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.0",
  "beautifulsoup4==4.14.3",
  "procrastinate==3.9.0",
  "psycopg[binary]==3.3.5",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsearch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["nodb: the test needs no database"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]
